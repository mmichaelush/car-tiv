<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ערוצים | CAR־טיב</title>
    <meta
      name="description"
      content="כל ערוצי הרכב שנכללים במאגר CAR־טיב, כולל הערוצים המומלצים."
    />
    <meta name="theme-color" content="#0e0916" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CAR־טיב" />
    <meta property="og:title" content="ערוצים | CAR־טיב" />
    <meta
      property="og:description"
      content="כל ערוצי הרכב שנכללים במאגר CAR־טיב, כולל הערוצים המומלצים."
    />
    <meta property="og:image" content="/assets/images/logo.png" />
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preload"
      href="/assets/fonts/rubik/rubik-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <script src="/theme-bootstrap.js"></script>
    <script type="module" src="/src/app/channels.ts"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">דילוג לתוכן</a>
    <header class="site-header" data-site-header></header>

    <main id="main">
      <section class="page-header shell">
        <div data-breadcrumbs></div>
        <p class="eyebrow">המקורות שלנו</p>
        <h1>ערוצי הרכב שבמאגר</h1>
        <p>
          כאן מופיעים הערוצים שדף הערוץ שלהם עצמו נפתח בנטפרי, כך שאפשר להיכנס אליהם ולהמשיך לגלוש.
          סרטונים מערוצים נוספים נמצאים במאגר וניתנים לצפייה — הם פשוט לא מופיעים ברשימה הזאת.
        </p>
        <div class="field" style="max-width: 26rem; margin-block-start: var(--space-4)">
          <label class="sr-only" for="channel-search">חיפוש ערוץ</label>
          <input
            class="input"
            id="channel-search"
            type="search"
            placeholder="חיפוש ערוץ…"
            data-channel-search
          />
        </div>
      </section>

      <section class="section shell">
        <div class="result-bar"><span data-result-summary>טוען ערוצים…</span></div>
        <div class="channel-grid" data-channel-grid aria-live="polite"></div>
        <div data-pager></div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>
  </body>
</html>
