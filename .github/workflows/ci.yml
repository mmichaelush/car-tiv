# CI — the same four checks `npm run verify` runs locally, so a green local run
# means a green pipeline. Nothing here is allowed to be a warning: a check that
# can be ignored will be.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Proves the legal pages still build from source and the site compiles.
      - name: Build
        run: npm run build

      # The two checks that need a real browser, and therefore cannot be unit
      # tests: happy-dom does not do layout and Node does not resolve
      # `light-dark()`. Both were written after a bug that had survived a full
      # visual review — a 27px horizontal scroll on every page, and two themes
      # failing WCAG contrast — so leaving them out of CI would mean they only
      # ever run when someone remembers.
      #
      # `playwright-core` ships no browsers on purpose (see the note in
      # `scripts/check-contrast.ts`), so the runner's own Chrome is used. Both
      # scripts honour `CHROMIUM_PATH`.
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Contrast
        run: npm run check:contrast
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Layout
        run: npm run check:layout
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
